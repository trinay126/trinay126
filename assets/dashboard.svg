  <title id="title">Trinay Sai Chadalavada Dashboard</title>
  <desc id="desc">Full premium cyber dashboard combining hero, about, roadmap, stack, certifications, analytics, and footer in one monitor-style layout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="2600">
