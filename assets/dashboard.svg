    <linearGradient id="accent" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#7c3aed" stop-opacity="0.95"/>
      <stop offset="0.66" stop-color="#dc143c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
