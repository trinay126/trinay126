<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skills Card</title>
  <desc id="desc">Animated premium skill matrix card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420">
      <stop offset="0" stop-color="#070912"/>
      <stop offset="1" stop-color="#100513"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#dc143c"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="60" y="76" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">SKILLS MATRIX</text>
  <text x="60" y="110" fill="#d1d5db" font-family="JetBrains Mono, Consolas, monospace" font-size="18">High-signal capabilities across backend, analytics, and automation</text>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">
    <rect x="60" y="150" width="300" height="90" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="60" y="150" width="300" height="8" rx="4" fill="url(#accent)"/>
    <text x="90" y="188" fill="#ffffff">Python</text>
    <text x="90" y="222" fill="#fca5a5">Backend automation • scripting</text>

    <rect x="450" y="150" width="300" height="90" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="450" y="150" width="300" height="8" rx="4" fill="url(#accent)"/>
    <text x="480" y="188" fill="#ffffff">FastAPI</text>
    <text x="480" y="222" fill="#fca5a5">REST APIs • auth • services</text>

    <rect x="840" y="150" width="300" height="90" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="840" y="150" width="300" height="8" rx="4" fill="url(#accent)"/>
    <text x="870" y="188" fill="#ffffff">PostgreSQL</text>
    <text x="870" y="222" fill="#fca5a5">Modeling • queries • tuning</text>

    <rect x="60" y="270" width="300" height="90" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="60" y="270" width="300" height="8" rx="4" fill="url(#accent)"/>
    <text x="90" y="308" fill="#ffffff">Power BI</text>
    <text x="90" y="342" fill="#fca5a5">Dashboards • reporting • DAX</text>

    <rect x="450" y="270" width="300" height="90" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="450" y="270" width="300" height="8" rx="4" fill="url(#accent)"/>
    <text x="480" y="308" fill="#ffffff">Docker</text>
    <text x="480" y="342" fill="#fca5a5">Builds • environments • ship</text>

    <rect x="840" y="270" width="300" height="90" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="840" y="270" width="300" height="8" rx="4" fill="url(#accent)"/>
    <text x="870" y="308" fill="#ffffff">Applied AI</text>
    <text x="870" y="342" fill="#fca5a5">Prompts • agents • LLMs</text>
