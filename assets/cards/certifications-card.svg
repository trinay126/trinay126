<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Certifications Card</title>
  <desc id="desc">Animated premium certifications panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
      <stop offset="0" stop-color="#070912"/>
      <stop offset="1" stop-color="#120513"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#dc143c"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="32" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="60" y="74" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">CERTIFICATIONS</text>
  <text x="60" y="108" fill="#d1d5db" font-family="JetBrains Mono, Consolas, monospace" font-size="18">Validated skill markers and learning proof</text>
  <g>
    <rect x="60" y="150" width="330" height="150" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="url(#stroke)" stroke-opacity="0.55"/>
    <rect x="435" y="150" width="330" height="150" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="url(#stroke)" stroke-opacity="0.55"/>
    <rect x="810" y="150" width="330" height="150" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="url(#stroke)" stroke-opacity="0.55"/>
  </g>
  <g fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">
    <text x="92" y="198" font-size="22" font-weight="700">Databricks AI Agent Fundamentals</text>
    <text x="92" y="230" font-size="16" fill="#d1d5db">Applied AI, agents, and product thinking</text>
    <text x="467" y="198" font-size="22" font-weight="700">Cisco Python Essentials</text>
    <text x="467" y="230" font-size="16" fill="#d1d5db">Python foundations with structured problem solving</text>
    <text x="842" y="198" font-size="22" font-weight="700">Microsoft Power BI (Coursera)</text>
    <text x="842" y="230" font-size="16" fill="#d1d5db">Analytics, dashboards, and reporting workflows</text>
  </g>
  <path d="M60 314H1140" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M60 314H220" stroke="url(#stroke)" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x1" values="60;940;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="220;1100;220" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>