<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hero Card</title>
  <desc id="desc">Premium hero card with glass panels, live status tags, and motion accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520">
      <stop offset="0" stop-color="#06070c"/>
      <stop offset="0.5" stop-color="#0c101d"/>
      <stop offset="1" stop-color="#13051a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#dc143c" stop-opacity="1"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="42" fill="url(#bg)"/>
  <rect x="92" y="34" width="1416" height="18" rx="9" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="672" y="18" width="256" height="20" rx="10" fill="#111827" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="696" y="22" width="208" height="12" rx="6" fill="url(#accent)" opacity="0.85"/>
  <circle cx="320" cy="128" r="210" fill="#dc143c" fill-opacity="0.16" filter="url(#soft)">
    <animate attributeName="cx" values="300;380;300" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1280" cy="110" r="240" fill="#7c3aed" fill-opacity="0.16" filter="url(#soft)">
    <animate attributeName="cy" values="96;150;96" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="70" y="66" width="1460" height="388" rx="34" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="112" y="96" width="1376" height="330" rx="28" fill="#09090f" fill-opacity="0.54" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="70" y="66" width="1460" height="8" rx="4" fill="url(#accent)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="110" y="156" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="2">TRINAY SAI CHADALAVADA</text>
  <text x="112" y="214" fill="#fca5a5" font-family="JetBrains Mono, Consolas, monospace" font-size="23" font-weight="600">Backend Developer • Python Developer • Data Analytics • Applied AI</text>
  <text x="112" y="272" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Building premium backend systems, analytics dashboards, and AI-first products.</text>
  <g>
    <rect x="112" y="320" width="210" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ff0033" stroke-opacity="0.5"/>
    <text x="217" y="350" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="16" text-anchor="middle">OPEN TO INTERNSHIP</text>
    <rect x="336" y="320" width="174" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#7c3aed" stroke-opacity="0.5"/>
    <text x="423" y="350" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="16" text-anchor="middle">OPEN TO WORK</text>
    <rect x="524" y="320" width="204" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="626" y="350" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="16" text-anchor="middle">CURRENT GOAL: AI SAAS</text>
  </g>
  <g>
    <rect x="1088" y="120" width="320" height="230" rx="24" fill="#07070d" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="1120" y="158" fill="#fca5a5" font-family="JetBrains Mono, Consolas, monospace" font-size="16">terminal://mission</text>
    <text x="1120" y="194" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="18">$ build --stack backend</text>
    <text x="1120" y="230" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="18">$ build --stack python</text>
    <text x="1120" y="266" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="18">$ build --stack analytics</text>
    <text x="1120" y="302" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="18">$ build --stack applied-ai</text>
    <rect x="1120" y="324" width="256" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="1120" y="324" width="184" height="8" rx="4" fill="#dc143c">
      <animate attributeName="width" values="164;224;164" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M70 486H1530" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M88 486H292" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="x1" values="88;1318;88" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="292;1530;292" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>